<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPARTAN GYM - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="login">
    <div class="auth-container">
      <div class="auth-header">
        <img
          src="img/logogym.png"
          alt="Spartan Gym Logo"
          style="width: 130px; height: 130px; object-fit: contain; filter: invert(1); margin-bottom: 8px"
        />
        <h1>SPARTAN GYM</h1>
        <p>Iniciar Sesión</p>
      </div>

      <div id="alertContainer"></div>

      <form id="formLogin">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            required
            autocomplete="email"
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            required
            autocomplete="current-password"
          />
          <div class="error-message" id="passwordError"></div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Iniciar Sesión</button>
      </form>

      <div class="auth-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></div>
    </div>

    <script src="js/validaciones.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
