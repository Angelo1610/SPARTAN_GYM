<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPARTAN GYM - Registro</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="registro">
    <div class="auth-container">
      <div class="auth-header">
        <img
          src="img/logogym.png"
          alt="Spartan Gym Logo"
          style="width: 130px; height: 130px; object-fit: contain; filter: invert(1); margin-bottom: 8px"
        />
        <h1>SPARTAN GYM</h1>
        <p>Crear Nueva Cuenta</p>
      </div>

      <div id="alertContainer"></div>

      <form id="formRegistro">
        <div class="form-group">
          <label for="nombre">Nombre Completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Juan Pérez"
            required
            autocomplete="name"
          />
          <div class="error-message" id="nombreError"></div>
          <div class="success-message" id="nombreSuccess"></div>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            required
            autocomplete="email"
          />
          <div class="error-message" id="emailError"></div>
          <div class="success-message" id="emailSuccess"></div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Crea una contraseña segura"
            required
            autocomplete="new-password"
          />
          <div class="password-strength" id="passwordStrength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="password-requirements" id="passwordRequirements">
            <div class="requirement" id="req-length">
              <span class="requirement-icon">✓</span>
              <span>Mínimo 8 caracteres</span>
            </div>
            <div class="requirement" id="req-upper">
              <span class="requirement-icon">✓</span>
              <span>Al menos una mayúscula (A-Z)</span>
            </div>
            <div class="requirement" id="req-lower">
              <span class="requirement-icon">✓</span>
              <span>Al menos una minúscula (a-z)</span>
            </div>
            <div class="requirement" id="req-number">
              <span class="requirement-icon">✓</span>
              <span>Al menos un número (0-9)</span>
            </div>
            <div class="requirement" id="req-special">
              <span class="requirement-icon">✓</span>
              <span>Al menos un carácter especial (!@#$%)</span>
            </div>
          </div>
          <div class="error-message" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Repite tu contraseña"
            required
            autocomplete="new-password"
          />
          <div class="error-message" id="confirmPasswordError"></div>
          <div class="success-message" id="confirmPasswordSuccess"></div>
        </div>

        <div class="form-group">
          <label for="rol">Tipo de Cuenta</label>
          <select id="rol" name="rol" required>
            <option value="user">Usuario (Reservas)</option>
            <option value="admin">Administrador (Gestión completa)</option>
          </select>
          <div class="error-message" id="rolError"></div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit" disabled>Crear Cuenta</button>
      </form>

      <div class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></div>
    </div>

    <script src="js/validaciones.js"></script>
    <script src="js/registro.js"></script>
  </body>
</html>
